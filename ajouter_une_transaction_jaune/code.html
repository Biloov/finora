<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-16 pb-20 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface/80 dark:bg-surface-container/80 backdrop-blur-xl">
<div class="flex items-center gap-gutter">

<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary dark:text-primary-fixed">Nouvelle Transaction</h1>

<div class="flex items-center">

<button class="flex-1 py-2 text-center rounded-lg bg-secondary-container shadow-[0px_4px_20px_rgba(254,208,27,0.15)] text-on-secondary-container font-body-sm text-body-sm font-semibold transition-all">Dépense</button>
<button class="flex-1 py-2 text-center rounded-lg text-on-surface-variant font-body-sm text-body-sm font-medium hover:text-primary transition-all">Revenu</button>
<button class="flex-1 py-2 text-center rounded-lg text-on-surface-variant font-body-sm text-body-sm font-medium hover:text-primary transition-all">Transfert</button>
</div>
<!-- Amount Input -->

<label class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm">MONTANT</label>
<div class="flex items-baseline gap-unit">
<input class="bg-transparent border-none text-center font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary focus:ring-0 p-0 w-32" placeholder="0" type="number" value="0"/>
<span class="font-body-lg text-body-lg text-on-surface-variant">FCFA</span>
</div>
</div>
<!-- Details Form -->
<div class="space-y-stack-md bg-surface rounded-xl p-container-padding shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-container-high">

<label class="font-label-caps text-label-caps text-on-surface-variant mb-unit">COMPTE</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-sm text-body-sm text-primary focus:border-secondary focus:ring-1 focus:ring-secondary appearance-none">
<option>Compte Courant Principal</option>
<option>Espèces</option>
<option>Carte Visa</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Date -->

<label class="font-label-caps text-label-caps text-on-surface-variant mb-unit">DATE</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-sm text-body-sm text-primary focus:border-secondary focus:ring-1 focus:ring-secondary" type="date" value="2024-05-15"/>
</div>
</div>

<label class="font-label-caps text-label-caps text-on-surface-variant mb-unit">PERSONNE CONCERNÉE</label>
